name: Frontend checks
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate Phase 6 screenshot and route assets
        run: npm run phase6:check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
